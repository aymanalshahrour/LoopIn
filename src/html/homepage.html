<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../css/homepagecss.css">
    <script src="../javascript/login.js"></script>

</head>
<body>

<div class="login-box">
    <h2>Sign In</h2>

    <form action="#" method="POST" id="login-form">
        <div class="input-group">
            <label for="username">Username or Email</label>
            <input type="text" id="username" name="username" required placeholder="Enter username or email">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter password">
        </div>

        <div class="show-password">
            <input type="checkbox" id="show-password-checkbox">
            <label for="show-password-checkbox">Show Password</label>
        </div>

        <p id="login-error" class="login-error" aria-live="polite"></p>

        <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="register-container">
        Don't have an account? <a href="register.html" class="register-link">Register</a>
    </div>
</div>

</body>
</html>
