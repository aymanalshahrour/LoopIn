<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="../css/registerpage.css">
    <script src="../javascript/register.js" defer></script>

</head>
<body>

<div class="register-box">
    <h2>Create an Account</h2>



    <form id="register-form">
        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Choose a username">
        </div>

        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Create a password">
        </div>

        <div class="input-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm_password" required placeholder="Confirm your password">
        </div>

        <div class="show-password">
            <input type="checkbox" id="show-password-checkbox">
            <label for="show-password-checkbox">Show Passwords</label>
        </div>

        <button type="submit" class="register-btn">Register</button>
    </form>

    <div class="login-container">
        Already have an account? <a href="index.html" class="login-link">Log in</a>
    </div>
</div>


</body>
</html>
